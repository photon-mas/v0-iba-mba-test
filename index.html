.timer{position:relative;width:64px;height:64px;flex:none}

/* ===== 0.1.1 ===== */
/* about: true 16:9 cover, separate portrait (never clipped by the cover) */
.about{max-width:980px;margin:0 auto}
.prof{position:relative;overflow:visible}
.covwrap{aspect-ratio:16/9;overflow:hidden;border-radius:var(--rad) var(--rad) 0 0;background:var(--soft)}
.cover-img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.pinfo{padding:0 28px 24px}
.phead{display:flex;align-items:flex-end;gap:18px;margin-top:-48px;position:relative;z-index:1}
.phead>div{padding-bottom:6px}
.pfp-img{display:block;width:120px;height:120px;flex:none;border-radius:50%;object-fit:cover;object-position:50% 40%;border:5px solid #fff;box-shadow:0 6px 22px rgba(19,32,27,.22);background:#fff}
.pinfo h2{font:500 clamp(30px,4.6vw,42px)/1.05 var(--fs);letter-spacing:-.01em;margin:4px 0 0}
@media (max-width:900px){.phead{margin-top:18px;align-items:center}.phead>div{padding-bottom:0}}
@media (max-width:640px){.pinfo{padding:0 16px 18px}.pfp-img{width:96px;height:96px;border-width:4px}}
.next{display:grid;gap:10px;margin-top:12px}
.nx{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;background:var(--soft)}
.nx>span:nth-child(2){flex:1}.nx b{display:block;font:700 17px/1.2 var(--fc)}
.soon{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px;font:600 12.5px/1 var(--fc);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--soft);border:1px dashed var(--line);cursor:not-allowed;user-select:none}
.soon svg{width:14px;height:14px}.soon.sm{padding:5px 9px;font-size:11px;flex:none}
.foot-note{margin:28px 0 0;text-align:center;color:var(--muted);font:italic 400 16px/1.5 var(--fs)}
/* page transitions */
.view.pt{animation:ptIn .28s var(--ease)}
@keyframes ptIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* header level chip */
.chip.xp{padding:4px 11px 4px 4px;gap:8px}
.lvb{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pri) var(--p),var(--line) 0);flex:none}
.lvb b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font:700 12.5px/1 var(--fc);color:var(--pri)}
.xpw{display:flex;flex-direction:column;gap:4px;min-width:70px}.xpw b{font:700 12.5px/1 var(--fc);letter-spacing:.04em;color:var(--ink)}

@media (max-width:860px){.xpw{display:none}.chip.xp{padding:3px 9px 3px 3px}}
/* sections stagger: stacks slide in one by one, donut segments draw in turn, bars grow in a stagger */
.stack div{transition:flex-grow .8s var(--ease) calc(var(--i,0)*.18s)}
.stack div>*,.stack div{color:#fff}
.donut .seg2{transition:stroke-dasharray .7s var(--ease) calc(var(--i,0)*.25s)}
.in .donut .seg2,.donut.in .seg2{stroke-dasharray:var(--da)}
.bar .fl{transition:width .9s var(--ease) calc(var(--i,0)*.06s)}

.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.13) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 7s ease-in-out 1.6s infinite;pointer-events:none}
@keyframes sheen{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
.bp{display:flex;gap:4px;margin-top:22px;max-width:640px;height:58px;border-radius:14px;overflow:hidden}
.bps{flex:0 0 0;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:0 12px;background:rgba(255,255,255,.2);transition:flex-grow .9s var(--ease) calc(.25s + var(--i)*.22s);overflow:hidden;white-space:nowrap}

  <div class="card pad rv lvcard2"><div class="lvbig sm" aria-hidden="true"><span>${v.l}</span></div><div style="flex:1;min-width:200px"><div class="row"><b class="lvn">Level ${v.l} · ${v.name}</b><span class="sp"></span><span class="muted small">${v.l < 10 ? fmtN(v.next - S.xp) + ' XP to ' + LNAMES[v.l] : 'Top level'}</span></div>

  <div class="grid g4 keep2 sec">${[['Questions answered', S.ans], ['Accuracy', (t.c + t.w ? pct(t.c, t.c + t.w) : 0) + '%'], ['Full mocks', S.mocks.length], ['Best mock net', best], ['Current streak', (S.streak.n || 0) + ((S.streak.n || 0) === 1 ? ' day' : ' days')], ['Daily Challenges', S.daily.n || 0], ['Timed tests', S.tests.length], ['Written pieces', S.wcount || 0]].map(([s, b]) => `<div class="card kpi rv"><b${cntAttrs(b)}>${b}</b><span>${s}</span></div>`).join('')}</div>
  <div class="grid g2 sec"><div class="card pad rv"><h3>Strength radar</h3><p class="small muted">Accuracy by section and in your three most-practised topics.</p>${radarSVG(ax)}</div>
   <div class="card pad rv"><h3>Accuracy by section</h3>${bars(['math', 'ana', 'eng'].map(k => { const x = S.st[k]; const p = x.c + x.w ? pct(x.c, x.c + x.w) : 0; return { l: SECN[k] + ` (${x.c + x.w})`, v: p, t: p + '%', c: SECC[k] }; }), 100)}
    <h3 class="sec" style="margin-top:22px">Mock net scores</h3>${S.mocks.length ? trendSVG(S.mocks.slice(0, 10).reverse().map(m => 100 * m.net / m.n), S.cut, S.mocks.slice(0, 10).reverse().map(m => String(m.net))) : ''}${S.mocks.length < 2 ? `<p class="small muted">${S.mocks.length ? 'Finish one more mock to see your trend.' : 'Finish a full mock to start your trend line.'}</p><a class="btn sec sm" href="#mock">${ico('layers')} Full mock</a>` : ''}</div></div>
  <div class="row sec" style="align-items:flex-end"><h2 style="margin:0">Badges</h2><span class="sp"></span><span class="muted small">${got} of ${BADGES.length} unlocked · ${Object.values(RARITY).join(' · ')}</span></div>
  <div class="badges rv">${BADGES.slice().sort((a, b) => (S.badges[b[0]] ? 1 : 0) - (S.badges[a[0]] ? 1 : 0) || order[a[3]] - order[b[3]]).map(badgeCard).join('')}</div></div>`;
}
/* ABOUT, SETTINGS, MORE */
const APPS = [['https://al-shahriar-12.github.io/flexure-mas/', 'Flexure MAS', 'Beam analysis: SFD, BMD, deflection', 'FX'], ['https://al-shahriar-12.github.io/frame-mas/', 'Frame MAS', '2D frame and truss analysis', 'FR'], ['https://al-shahriar-12.github.io/bnbc-frame-mas/', 'BNBC Frame MAS', 'BNBC 2020 frame design assistant', 'BN'], ['https://al-shahriar-12.github.io/beam-frame-mas/', 'Beam-Frame MAS', 'Beams and frames in one app', 'BF'], ['https://al-shahriar-12.github.io/chess-mas/', 'Chess MAS', 'Tired of solving problems? Play chess', 'CH'], ['https://al-shahriar-12.github.io/vocab-master/', 'Vocab MASter', 'Dictionary and thesaurus with Bangla meanings', 'VM']];
function pAbout() {
  const b = DATA.bank || { items: [] }; const nItems = (b.items || []).length; const nSets = Object.keys(b.sets || {}).length; const nPr = (b.prompts || []).length;
  view().innerHTML = `<div class="wrap pg about">
  <section class="card prof"><div class="covwrap"><img class="cover-img" src="author-cover.jpg" alt="MD Al Shahriar in front of a red brick wall" width="1600" height="900"></div>
   <div class="pinfo"><div class="phead"><img class="pfp-img" src="author.jpg" alt="Portrait of MD Al Shahriar" width="480" height="480"><div><div class="eyebrow">About me</div><h2>MD Al Shahriar</h2></div></div><p class="muted" style="margin:4px 0 12px">MBA, Institute of Business Administration (IBA), University of Dhaka<br>BSc. in Civil Engineering, Bangladesh University of Engineering and Technology (BUET)<br>Founder, MAS Studio</p>
   <p>MAS Studio (MAS = Mohammad Al Shahriar) builds free, open-source web apps for students, especially in Bangladesh. The engineering apps solve the beam and frame problems civil engineering students meet most often. Vocab MASter brings the same care to words. Every app is free, installable and works offline.</p>
   <div class="row"><a class="btn sec sm" href="https://github.com/Al-Shahriar-12" target="_blank" rel="noopener">GitHub · Al-Shahriar-12</a><a class="btn sec sm" href="https://www.youtube.com/channel/UCywFnnFoQ9N071noUAL_m8A" target="_blank" rel="noopener">YouTube channel</a><a class="btn ghost sm" href="https://youtu.be/g8ctr2cVJ-A" target="_blank" rel="noopener">How to use the engineering apps</a></div></div></section>
  <section class="hero compact sec"><span class="flagdisc"></span>${markSVG('bigmark')}<div class="eyebrow">This app</div><h2 style="color:#fff;font-size:30px">Built for the IBA admission test</h2><p class="lede">For students preparing for the IBA, University of Dhaka MBA and BBA admission tests: timed practice in every section, a written lab and an honest analysis of the paper.</p><p style="color:rgba(255,255,255,.88);font-size:14px;margin:0">A personal study project. It is not an official publication of the Institute of Business Administration or the University of Dhaka.</p></section>
  <section class="card pad sec"><div class="eyebrow">MAS Studio</div><h2 style="margin-bottom:12px">Apps by MAS Studio</h2><div class="apps">${APPS.map(a => `<a class="app" href="${a[0]}" ${a[0][0] === '#' ? '' : 'target="_blank" rel="noopener"'}><span class="ai">${a[3]}</span><span><b>${a[1]}</b><span>${a[2]}</span></span></a>`).join('')}</div><p class="muted" style="margin:12px 0 0">Free and offline-ready. Please share them with your friends and juniors.</p></section>
  <section class="card pad sec"><div class="eyebrow">About this app</div><h2>Photon IBA · Test Lab ${VERSION}</h2><p>${MG.list.length} math generators with worked solutions, ${fmtN(nItems)} original English and Analytical questions with ${nSets} reading passages and puzzle sets, ${nPr} writing prompts, vocabulary drills from ${VW ? fmtN(VW.length) : '2,580'} Vocab MASter entries, full mocks, timed tests, Trap Spotter and the Written Lab.</p>
   <ul><li><b>Exam analysis:</b> data analysis and pattern recognition across 14 years of IBA BBA papers (2005–06 to 2019–20) and recent MBA exam patterns.</li><li><b>Questions:</b> original practice items and generated math; vocabulary from Vocab MASter (definitions and sentences written for it; extra senses from WordNet 3.1, Princeton University). No questions or explanations are copied from books.</li><li><b>Fonts:</b> Barlow, Barlow Condensed and Newsreader (SIL Open Font License).</li></ul>
   <div class="row" style="margin:4px 0 14px"><button class="btn sec sm" id="offl">${ico('dl')} Save everything for offline use</button><span class="small muted" id="offt"></span></div>
   <p class="note">Version ${VERSION}: Daily Challenge, levels, quests, 24 badges and new infographics. Your saved items and progress stay in this browser on this device. Patterns change from year to year. Always check the official IBA circular.</p></section>
  <section class="card pad sec"><div class="eyebrow">What's next</div><h2>Coming to Photon IBA</h2><div class="next">${[['layers', 'Real IBA model tests', 'Full papers shuffled from past years and extra resources.'], ['brain', 'Expected in your IBA', 'Deep research and analysis of what this year’s paper is likely to ask.'], ['dl', 'Download your report', 'Your test score with solutions as a PDF.']].map(([i, t, d]) => `<div class="nx"><span class="ti">${ico(i)}</span><span><b>${t}</b><span class="small muted">${d}</span></span><span class="soon sm">Coming soon</span></div>`).join('')}</div></section>
  <p class="dua">If this app helped you, please remember its author in your duas.</p></div>`;
  $('#offl').onclick = () => { const t = $('#offt'); t.textContent = 'Saving…'; Promise.all([getData('bank'), vocabReady()]).then(([bk, vw]) => { const ok = (bk.items || []).length && vw.length; t.textContent = ok ? (window.IBA_PACK ? 'Everything is already inside this file.' : 'Saved: questions and ' + fmtN(vw.length) + ' vocabulary entries now work offline.') : 'Could not load everything. Try again when you are online.'; if (ok) toast('Ready for offline use'); }); };
}
function brandPrev(v) { return v === 'B' ? `<div class="pv" style="background:linear-gradient(135deg,#00805D,#00543D)"><span class="disc" style="background:#E0283E;color:#fff">${markSVG()}</span></div>` : `<div class="pv" style="background:linear-gradient(135deg,#E0283E,#A9182B)"><span class="disc" style="background:#fff;color:#006A4E">${markSVG()}</span></div>`; }
function pSettings() {
  let th = ''; try { th = localStorage.getItem(KEY + '-theme') || ''; } catch (e) { }
  view().innerHTML = `<div class="wrap pg"><div class="eyebrow">Settings</div><h1>Make it yours</h1>
  <div class="card pad rv"><h3>Exam mode</h3><div class="seg" id="smode"><button data-v="mba" class="${S.mode === 'mba' ? 'on' : ''}">MBA (default)</button><button data-v="bba" class="${S.mode === 'bba' ? 'on' : ''}">BBA</button></div></div>
  <div class="card pad sec rv"><h3>Brand preview</h3><p class="muted small">Two directions for the new logo colours. Pick one to preview it across the app.</p><div class="brandopt">${[['A', 'A · Red background, green logo', 'Green mark on a white disc for contrast'], ['B', 'B · Green background, red logo', 'Flag motif: red disc, white mark']].map(([k, t, s]) => `<button data-b="${k}" class="${S.brand === k ? 'on' : ''}">${brandPrev(k)}<span>${t}<small>${s}</small></span></button>`).join('')}</div>
   <div class="note" style="margin-top:12px"><b>Designer's note.</b> Pure green on red has almost the same brightness, so the logo would vibrate and disappear for many colour-blind people (red-green colour blindness affects roughly 1 in 12 men). Option A therefore puts the green mark on a white disc. Option B borrows the national flag — a red disc on green with a white mark — and has stronger contrast at small sizes, so I recommend <b>B</b>. In both, green carries actions and "correct", and red is kept for the brand and "wrong", always with an icon and a word.</div></div>
  <div class="card pad sec rv"><h3>Theme</h3><div class="seg" id="sth">${[['', 'Auto'], ['light', 'Light'], ['dark', 'Dark']].map(([v, l]) => `<button data-v="${v}" class="${th === v ? 'on' : ''}">${l}</button>`).join('')}</div>
   <h3 class="sec">Mock and targets</h3><div class="grid g3"><label class="fld">MCQ minutes<input type="number" id="smm" value="${S.mcqMin}"></label><label class="fld">Written minutes<input type="number" id="smw" value="${S.wMin}"></label><label class="fld">Cut target (%)<input type="number" id="smc" value="${S.cut}"></label></div>
   <label class="check" style="border:0"><input type="checkbox" id="sso" ${S.sound ? 'checked' : ''}><span>Sound effects</span></label></div>
  <div class="card pad sec rv"><h3>Your data</h3><p class="muted small">Progress is stored only in this browser. Export it to move to another device.</p><div class="row"><button class="btn sec sm" id="sex">${ico('dl')} Export progress</button><label class="btn sec sm">${ico('up')} Import<input type="file" id="sim" accept="application/json" hidden></label><button class="btn ghost sm" id="srs" style="color:var(--bad)">${ico('trash')} Reset everything</button></div></div></div>`;
  $$('#smode button').forEach(b => b.onclick = () => { S.mode = b.dataset.v; save(); pSettings(); hdrNav('settings'); reveal(); });
  $$('[data-b]').forEach(b => b.onclick = () => { S.brand = b.dataset.b; save(); applyLook(); pSettings(); reveal(); });
  $$('#sth button').forEach(b => b.onclick = () => { try { if (b.dataset.v) localStorage.setItem(KEY + '-theme', b.dataset.v); else localStorage.removeItem(KEY + '-theme'); } catch (e) { } applyLook(); pSettings(); reveal(); });
  ['smm', 'smw', 'smc'].forEach(id => $('#' + id).onchange = () => { S.mcqMin = Math.max(10, +$('#smm').value || 60); S.wMin = Math.max(0, +$('#smw').value || 0); S.cut = Math.min(90, Math.max(10, +$('#smc').value || 40)); save(); toast('Saved'); });
  $('#sso').onchange = e => { S.sound = e.target.checked; save(); };
  $('#sex').onclick = () => { if (window.IBA_ARTIFACT) { const t = JSON.stringify(S); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Backup copied. Paste it into a .json file to keep it.')).catch(() => toast('Copy failed: use the downloaded app to export.')); return; } const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = 'photon-iba-progress.json'; a.click(); };
  $('#sim').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { const o = JSON.parse(t); if (o.v !== 1) throw 0; S = Object.assign(defState(), o); save(); toast('Progress imported'); route(); }).catch(() => toast('That file is not a Photon IBA backup.')); };
  $('#srs').onclick = () => { if (confirm('Delete all progress, mocks, drafts and settings on this device?')) { S = defState(); save(); try { localStorage.removeItem(KEY + '-theme'); } catch (e) { } applyLook(); route(); } };
}
function pMore() {

$('#modechip').onclick = () => { S.mode = S.mode === 'mba' ? 'bba' : 'mba'; save(); toast(S.mode.toUpperCase() + ' mode'); route(); };
$('#themeb').onclick = () => { const r = document.documentElement; const cur = r.getAttribute('data-theme'); const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; const nx = dark ? 'light' : 'dark'; try { localStorage.setItem(KEY + '-theme', nx); } catch (e) { } applyLook(); };
